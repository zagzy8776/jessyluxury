name: Admin Hardening Patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
      - name: Patch admin mutation flows
        shell: python
        run: |
          from pathlib import Path

          # Product list: real delete/import error handling; import through API.
          p = Path('app/store-portal-jl/dashboard/products/page.tsx')
          s = p.read_text()
          s = s.replace("""      const res = await fetch(`/api/products/${id}`, { method: 'DELETE' })\n      showToast('Product deleted successfully')\n      fetchProducts()""", """      const res = await fetch(`/api/products/${id}`, { method: 'DELETE' })\n      const data = await res.json().catch(() => ({}))\n      if (!res.ok) {\n        showToast(data.error || 'Failed to delete product', 'error')\n        return\n      }\n      showToast('Product deleted successfully')\n      fetchProducts()""")
          s = s.replace("""      await new Promise((r) => setTimeout(r, 1200))\n      showToast('CSV Parsed! Products updated from catalog file.')\n      setShowImportModal(false)\n      fetchProducts()""", """      const text = await file.text()\n      const res = await fetch('/api/products/import', {\n        method: 'POST',\n        headers: { 'Content-Type': 'text/csv' },\n        body: text,\n      })\n      const data = await res.json().catch(() => ({}))\n      if (!res.ok) {\n        showToast(data.error || 'CSV import failed', 'error')\n        return\n      }\n      showToast(`${data.created ?? 0} created, ${data.updated ?? 0} updated successfully`)\n      setShowImportModal(false)\n      fetchProducts()""")
          p.write_text(s)

          # Product editor: do not force camera; check create/update response before success.
          p = Path('app/store-portal-jl/dashboard/products/add/page.tsx')
          s = p.read_text()
          s = s.replace('type="file"\n            accept="image/*"\n            capture="environment"', 'type="file"\n            accept="image/*"')
          old = """      if (editId) {\n        await fetch(`/api/products/${editId}`, {\n          method: 'PUT',\n          headers: { 'Content-Type': 'application/json' },\n          body: JSON.stringify(payload),\n        })\n        showToast('Fragrance updated successfully!')\n      } else {\n        await fetch('/api/products', {\n          method: 'POST',\n          headers: { 'Content-Type': 'application/json' },\n          body: JSON.stringify(payload),\n        })\n        showToast('Fragrance added to catalog!')\n      }\n      setTimeout(() => {\n        router.push('/store-portal-jl/dashboard/products')\n      }, 1000)"""
          new = """      const endpoint = editId ? `/api/products/${editId}` : '/api/products'\n      const method = editId ? 'PUT' : 'POST'\n      const res = await fetch(endpoint, {\n        method,\n        headers: { 'Content-Type': 'application/json' },\n        body: JSON.stringify(payload),\n      })\n      const data = await res.json().catch(() => ({}))\n      if (!res.ok) {\n        showToast(data.error || 'Failed to save product', 'error')\n        return\n      }\n      showToast(editId ? 'Fragrance updated successfully!' : 'Fragrance added to catalog!')\n      setTimeout(() => {\n        router.push('/store-portal-jl/dashboard/products')\n      }, 700)"""
          if old not in s:
              raise SystemExit('Product editor submit block not found')
          s = s.replace(old, new)
          p.write_text(s)

      - name: Commit admin hardening changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/store-portal-jl/dashboard/products/page.tsx app/store-portal-jl/dashboard/products/add/page.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix(admin): harden product mutations and uploads"
          git push

      - name: Remove one-time patch workflow
        if: success()
        shell: bash
        run: |
          git rm .github/workflows/admin-hardening-patch.yml
          git commit -m "chore: remove one-time admin hardening workflow"
          git push
