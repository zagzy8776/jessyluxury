name: Apply generated collection artwork

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[category-art-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch storefront category artwork
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/page.tsx')
          s = p.read_text(encoding='utf-8')

          old_grad = """const CATEGORY_GRADIENTS: Record<string, string> = {
  oud: 'linear-gradient(135deg,#2a1c08,#6b3d12 55%,#241405)',
  fresh: 'linear-gradient(135deg,#0e2f36,#5aa0a0 55%,#123038)',
  sweet: 'linear-gradient(135deg,#2e1a0e,#c98a3d 55%,#3a2412)',
  amber: 'linear-gradient(135deg,#241a0e,#8a5a13 55%,#d9a441)',
}
"""
          new_grad = old_grad + """
const GENERATED_CATEGORY_ART: Record<string, string> = {
  'Best Sellers': '/category-art/best-sellers.svg',
  'New Arrivals': '/category-art/new-arrivals.svg',
  'Oud & Amber': '/category-art/oud-amber.svg',
  'Fresh & Floral': '/category-art/fresh-floral.svg',
  'Sweet & Gourmand': '/category-art/sweet-gourmand.svg',
  'Gift Sets': '/category-art/gift-sets.svg',
}
"""
          if old_grad not in s:
              raise SystemExit('CATEGORY_GRADIENTS block not found')
          s = s.replace(old_grad, new_grad, 1)

          old_return = "return { ...card, imageUrl: getFirstImage(match) }"
          new_return = "return { ...card, imageUrl: getFirstImage(match), fallbackImage: GENERATED_CATEGORY_ART[card.label] }"
          if old_return not in s:
              raise SystemExit('category image return line not found')
          s = s.replace(old_return, new_return, 1)

          old_copy = "Curated directly from the live catalogue. Product photography appears here only when a real product image is available."
          new_copy = "Curated from the live catalogue with premium Jessy Luxury campaign artwork; real product photography takes priority whenever available."
          if old_copy not in s:
              raise SystemExit('collection copy not found')
          s = s.replace(old_copy, new_copy, 1)

          old_fallback = """<span className=\"absolute inset-x-6 top-8 h-24 rounded-full border border-white/10 bg-white/5\" aria-hidden=\"true\" />"""
          new_fallback = """<img
                  src={c.fallbackImage}
                  alt=\"\"
                  aria-hidden=\"true\"
                  className=\"absolute inset-0 h-full w-full object-cover opacity-95 transition duration-700 group-hover:scale-105 group-hover:opacity-100\"
                  loading=\"lazy\"
                />"""
          if old_fallback not in s:
              raise SystemExit('fallback placeholder not found')
          s = s.replace(old_fallback, new_fallback, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit storefront artwork patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx public/category-art
          git rm .github/workflows/apply-category-art.yml
          git commit -m "feat(storefront): add generated collection artwork [category-art-patched]"
          git push