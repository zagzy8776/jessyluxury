name: Patch Checkout Runtime

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch customer checkout handling
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs')
          const path = 'components/CartDrawer.tsx'
          let text = fs.readFileSync(path, 'utf8')

          const oldValidation = `    if (!name.trim() || !phone.trim()) {\n      setCheckoutError('Please enter your Name and Phone Number')\n      return\n    }\n    setOrdering(true)`
          const newValidation = `    if (!name.trim() || !phone.trim()) {\n      setCheckoutError('Please enter your Name and Phone Number')\n      return\n    }\n    if (!selectedZone) {\n      setCheckoutError('Please select a delivery option')\n      return\n    }\n    if (!selectedZone.isPickup && !address.trim()) {\n      setCheckoutError('Please enter your delivery address')\n      return\n    }\n    setOrdering(true)`

          if (!text.includes(oldValidation)) throw new Error('Checkout validation block not found')
          text = text.replace(oldValidation, newValidation)

          const oldResponse = `      const orderData = await res.json()\n      const orderNum = orderData.orderNumber || \`JL-${Math.floor(100000 + Math.random() * 900000)}\`\n\n      const lines = items`
          const newResponse = `      const orderData = await res.json()\n      if (!res.ok || !orderData.success || !orderData.orderNumber) {\n        setCheckoutError(orderData.error || 'We could not place your order. Please try again.')\n        return\n      }\n      const orderNum = orderData.orderNumber\n      const confirmedTotal = Number(orderData.total) || finalTotal\n\n      const lines = items`

          if (!text.includes(oldResponse)) throw new Error('Checkout response block not found')
          text = text.replace(oldResponse, newResponse)

          const oldTotal = `        \`Total: ${formatNaira(finalTotal)}\\n\\n\` +`
          const newTotal = `        \`Total: ${formatNaira(confirmedTotal)}\\n\\n\` +`
          if (!text.includes(oldTotal)) throw new Error('Checkout total line not found')
          text = text.replace(oldTotal, newTotal)

          fs.writeFileSync(path, text)
          NODE

      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/CartDrawer.tsx .github/workflows/patch-checkout-runtime.yml
          git commit -m "fix(checkout): handle customer order failures safely" || exit 0
          git push
